# Production profile. Start with:  java -jar app.jar --spring.profiles.active=prod
# Every secret comes from an environment variable, nothing sensitive is stored in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500}
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.upload-dir=${UPLOAD_DIR:uploads}

# No demo accounts in production. The admin is created once from these values.
app.seed.demo-users=false
app.admin.email=${ADMIN_EMAIL:admin@cms.com}
app.admin.password=${ADMIN_PASSWORD}
