spring.application.name=complaint-management
server.port=8080

# ---- MySQL (CHANGE the password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=CHANGE_ME
spring.config.import=optional:classpath:application-local.properties
# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 

 
# ---- File upload (used in later steps) ----
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=uploads

# ---- SLA deadlines in hours (used by escalation, later step) ----
app.sla.critical=24
app.sla.high=72
app.sla.medium=120
app.sla.low=168
# ---- JWT and CORS (Step 3) ----
app.jwt.secret=cms-jwt-secret-key-change-this-before-deploying-2026-xyz
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501
